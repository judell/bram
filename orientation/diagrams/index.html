<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- A copy of ../index.html. The base tag makes every relative path
         (Main.xmlui, arch.js, the content files, the nav links) resolve in
         the parent folder, so this page shares the site; only the page name
         and the nav's bold entry differ. -->
    <base href="../" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Overview and architecture</title>
    <!-- A static orientation site: an overview and architecture diagrams of
         this repo, from Bram's orientation template
         (.claude/bram-reference/orientation.md). Serve this folder with any
         static server; all paths are relative. Not part of the project
         unless the user chose to commit it.
         XMLUI is the standalone engine Bram itself ships. pages.yml copies
         app/vendor/xmlui-standalone.umd.js to site/extras/vendor/, so this
         absolute URL tracks the engine in the repo and moves only when Bram
         re-vendors and Pages deploys; it replaces the unversioned
         xmlui.org/xmlui.js, which an upstream release could change under a
         published site. It needs network, as Mermaid does. Mermaid is pinned.
         arch.js loads first: the engine snapshots window at boot, so Arch
         must exist by then. -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.12.1/dist/mermaid.min.js"></script>
    <script>window.ORIENTATION_PAGE = "diagrams";</script>
    <script src="arch.js"></script>
    <script src="https://judell.github.io/bram/extras/vendor/xmlui-standalone.umd.js"></script>
    <style>
      /* The nav is plain HTML outside the XMLUI root, so its links are the
         web's own: relative hrefs, full page loads, no router. Colors match
         the site's palette in Main.xmlui. */
      body { margin: 0; background: #fbfaf7; color: #1d1d1b; }
      nav.site-nav { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 14px 24px 0; }
      nav.site-nav a { color: #2f5d8a; }
    </style>
  </head>
  <body>
    <nav class="site-nav"><a href="./">Start</a> · <strong>Diagrams</strong> · <a href="overview/">Overview</a></nav>
    <div id="root"></div>
  </body>
</html>
