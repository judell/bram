# Publishes site/ to GitHub Pages (https://judell.github.io/bram/).
# Pages source is set to "GitHub Actions" in the repo settings.
# Pattern: https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "orientation/**"
      - "app/vendor/xmlui-standalone.umd.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # site/extras/ pages run on Bram's own XMLUI engine. Copy it in rather
      # than commit a second 5 MB copy (site/extras/.gitignore).
      - name: Copy the XMLUI engine for site/extras
        run: mkdir -p site/extras/vendor && cp app/vendor/xmlui-standalone.umd.js site/extras/vendor/
      # The orientation site lives at the repo root because it's this repo's
      # target app. It publishes at /orientation/.
      - name: Copy the orientation site
        run: cp -R orientation site/orientation
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
