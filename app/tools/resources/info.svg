<!-- session-context-pane (Jon, 2026-11-23): the pane's little-i. Registered
     as icon.info in config.json, so every icon="info" in the pane renders
     this circled lowercase i instead of XMLUI's built-in, which reads as an
     exclamation point (https://www.xmlui.org/docs/howto/add-custom-icons,
     "Override built-in icons by reusing the name"). Drawn to match the
     lucide-style icons beside it: 24-box, 2px stroke, currentColor. -->
<svg
  class="lucide lucide-info"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <circle cx="12" cy="12" r="10" />
  <path d="M12 16v-5" />
  <path d="M11 11h1" />
  <path d="M12 8h.01" />
</svg>
