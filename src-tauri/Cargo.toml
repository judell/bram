[package]
name = "bram"
version = "0.8.11"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bram_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# context-stack-viewer: a Claude session file names each request's messages
# by the SHA-256 of their canonical JSON; the stack resolves them the same way.
sha2 = "0.10"
portable-pty = "0.9.0"
notify = "8.2.0"
tiny_http = "0.12"
include_dir = "0.7"
# guard-self-route-hardlink: file identity (volume serial + file index on
# Windows, device+inode on Unix) so the guard recognises a hard link to
# itself. Already in Cargo.lock via walkdir, so this compiles nothing new.
same-file = "1"
ureq = "2"
libc = "0.2"
similar = "2"
sqlformat = "0.3"
loomweave-scanner = "=1.4.0"
flate2 = { version = "=1.1.9", default-features = false, features = ["miniz_oxide"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
time = { version = "0.3.54", features = ["parsing"] }
uuid = { version = "1", features = ["v4"] }

# issue-403-dock-badge: draw each instance's Dock icon with its project's name
# on a strip in its project color (NSApplication.setApplicationIconImage).
# All already in Cargo.lock through tao, so this compiles nothing new;
# default-features off because objc2-app-kit's defaults turn on all of AppKit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSGeometry", "NSAttributedString", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSResponder", "NSImage", "NSColor", "NSBezierPath", "NSFont", "NSFontDescriptor", "NSStringDrawing", "NSAttributedString", "NSGraphics", "NSRunningApplication"] }

# bram-guard-authority-flip: serde_json parses transcript lines on the
# guard's deny path, and debug is the shipping format — at opt-level 0 the
# scan ran ~3x slower than the Python guard's C json on the same payload.
# Optimize just this dependency in dev builds; the reverse tail scan in
# guard_policy fixes the algorithmic half.
[profile.dev.package.serde_json]
opt-level = 3
